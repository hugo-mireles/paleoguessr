<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leaflet Map Quiz</title>
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
    crossorigin=""/>
    <!-- Page CSS -->
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="quiz-box">
        <h2 id="prompt">Loading locations...</h2>
        <div id="score">Score: 0/0</div>
        <button id="next-btn" onclick="nextQuestion()">Next</button>
    </div>

    <div id="settings-box">
        <h2 id="prompt">Paleoguesser</h2>
        <p id="description">Filter out specific areas to focus on</p>

        <!-- Continent Filters -->
        <fieldset id="filter-cont" class="filter-menu">
            <legend>Continents:</legend>
            <label class="filter-check">
                <input type="checkbox" name="continents" value="africa" onchange="onFilterUpdate(this)" checked> Africa
            </label>
            <label class="filter-check">
                <input type="checkbox" name="continents" value="america" onchange="onFilterUpdate(this)" checked> America
            </label>
            <label class="filter-check">
                <input type="checkbox" name="continents" value="antractica" onchange="onFilterUpdate(this)" checked> Antarctica
            </label>
            <label class="filter-check">
                <input type="checkbox" name="continents" value="asia" onchange="onFilterUpdate(this)" checked> Asia
            </label>
            <label class="filter-check">
                <input type="checkbox" name="continents" value="europe" onchange="onFilterUpdate(this)" checked> Europe
            </label>
            <label class="filter-check">
                <input type="checkbox" name="continents" value="oceania" onchange="onFilterUpdate(this)" checked> Oceania
            </label>
        </fieldset>
        <!-- Tag Filters -->
        <fieldset id="filter-tag" class="filter-menu">
            <legend>Region Types:</legend>
            <label class="filter-check">
                <input type="checkbox" name="tags" value="locality" onchange="onFilterUpdate(this)" checked> Localities
            </label>
            <label class="filter-check">
                <input type="checkbox" name="tags" value="geologic-feature" onchange="onFilterUpdate(this)" checked> Geologic Features
            </label>
            <label class="filter-check">
                <input type="checkbox" name="tags" value="city" onchange="onFilterUpdate(this)" checked> Cities
            </label>
            <label class="filter-check">
                <input type="checkbox" name="tags" value="state" onchange="onFilterUpdate(this)" checked> States
            </label>
            <label class="filter-check">
                <input type="checkbox" name="tags" value="country" onchange="onFilterUpdate(this)" checked> Countrys
            </label>
        </fieldset>
        <!-- Start and view buttons -->
        <button id="start-btn" onclick="switchToPlay()">Start Game</button>
        <button id="view-btn" onclick="switchToView()">View Locations</button>
        <button id="flash-btn" onclick="flashTips()">Flash Locations</button>
    </div>

    <div id="map"></div>

    <!-- External Leaflet & PapaParse Libraries -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
    crossorigin=""></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/4.1.2/papaparse.min.js"></script>

    <script src="app.js" type='module' defer></script>
</body>
</html>
